
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6f91">
<title>For Baby Sol ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #ff1f5a;
  --light-pink: #ff6f91;
  --white: #fff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  background: linear-gradient(135deg, #ff6f91, #ff9a9e, #ffc3a0);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  color: var(--white);
  position: relative;
  padding: 24px 15px;
}

body::before {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  background: rgba(255,255,255,.22);
  filter: blur(100px);
  top: 10%;
  left: 10%;
  pointer-events: none;
  animation: moveGlow 8s ease-in-out infinite alternate;
}

.container {
  text-align: center;
  width: 100%;
  max-width: 440px;
  position: relative;
  z-index: 1;
  padding: 15px 0;
}

.tap {
  font-size: 15px;
  margin-bottom: 35px;
  animation: pulse 1.5s infinite;
}

.heart {
  width: 76px;
  height: 76px;
  margin: 0 auto 42px;
  background: var(--pink);
  transform: rotate(-45deg);
  animation: beat 1.2s infinite;
  cursor: pointer;
  position: relative;
  border: none;
  display: block;
  box-shadow: 0 0 35px rgba(255,31,90,.3);
  -webkit-tap-highlight-color: transparent;
}

.heart::before,
.heart::after {
  content: "";
  width: 76px;
  height: 76px;
  background: var(--pink);
  border-radius: 50%;
  position: absolute;
}

.heart::before {
  top: -38px;
  left: 0;
}

.heart::after {
  left: 38px;
  top: 0;
}

.heart:focus-visible {
  outline: 3px solid white;
  outline-offset: 10px;
}

.name {
  font-family: 'Pacifico', cursive;
  font-size: clamp(27px, 7vw, 36px);
  margin-bottom: 18px;
  display: none;
  text-shadow: 0 3px 10px rgba(120,0,35,.15);
}

.message {
  font-size: 14px;
  line-height: 1.9;
  display: none;
  padding: 0 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 100px;
}

.buttons {
  margin: 24px auto 0;
  display: none;
  position: relative;
  min-height: 95px;
  width: 100%;
}

button {
  border: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  padding: 13px 25px;
  transition: transform .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
}

.yes {
  background: white;
  color: var(--pink);
  box-shadow: 0 4px 15px rgba(0,0,0,.18);
  margin: 10px 5px;
}

.yes:hover {
  transform: scale(1.06);
  box-shadow: 0 6px 20px rgba(0,0,0,.22);
}

.no {
  background: var(--pink);
  color: white;
  position: absolute;
  top: 10px;
  left: 58%;
  margin: 0;
  touch-action: manipulation;
}

.tease {
  font-size: 13px;
  margin-top: 8px;
  min-height: 22px;
}

.final {
  display: none;
  font-size: 16px;
  margin-top: 20px;
  line-height: 1.9;
  animation: fadeIn .8s ease;
}

.signature {
  margin-top: 15px;
  font-family: 'Pacifico', cursive;
  font-size: 21px;
}

.whatsapp-link {
  display: none;
  margin: 18px auto 0;
  padding: 12px 20px;
  border-radius: 30px;
  background: #fff;
  color: #d91b50;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

.floating-heart,
.floating-text {
  position: fixed;
  bottom: -30px;
  z-index: 0;
  pointer-events: none;
  opacity: .8;
  animation: floatUp 5s linear forwards;
}

.floating-heart {
  font-size: 19px;
}

.floating-text {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.password-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #270813, #600d2c, #260814);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 1000;
  color: white;
  padding: 24px;
  text-align: center;
}

.password-overlay h2 {
  font-family: 'Pacifico', cursive;
  font-size: 28px;
  margin-bottom: 10px;
}

.password-overlay p {
  font-size: 13px;
  margin-bottom: 20px;
  opacity: .85;
}

.password-overlay form {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 290px;
}

.password-overlay input {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 2px solid transparent;
  outline: none;
  font-size: 16px;
  margin-bottom: 12px;
  text-align: center;
}

.password-overlay input:focus {
  border-color: #ff6f91;
}

.password-overlay button {
  background: var(--pink);
  color: white;
  border-radius: 10px;
  padding: 12px;
}

.password-error {
  font-size: 13px;
  color: #ffc2d0;
  min-height: 22px;
  margin-top: 12px;
}

@keyframes beat {
  0%, 50%, 100% { transform: rotate(-45deg) scale(1); }
  25%, 75% { transform: rotate(-45deg) scale(1.1); }
}

@keyframes pulse {
  0%, 100% { opacity: .55; }
  50% { opacity: 1; }
}

@keyframes moveGlow {
  from { transform: translate(0,0); }
  to { transform: translate(45px,65px); }
}

@keyframes floatUp {
  from { transform: translateY(0) rotate(0); opacity: .8; }
  to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 380px) {
  .message { font-size: 13px; }
  .yes { padding: 12px 20px; }
  .no { padding: 12px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div class="password-overlay" id="passwordOverlay">
  <h2>For Baby Sol ❤️</h2>
  <p>A little surprise made just for you 💌</p>

  <form id="passwordForm">
    <input
      type="password"
      id="pwd"
      placeholder="Enter password ❤️"
      autocomplete="off"
      aria-label="Website password"
      required
    >
    <button type="submit">Unlock My Heart 💖</button>
    <div class="password-error" id="passwordError" role="status"></div>
  </form>
</div>

<main class="container">
  <div class="tap" id="tapText">Tap the heart ❤️</div>

  <button
    type="button"
    class="heart"
    id="heart"
    aria-label="Open your love letter"
  ></button>

  <div class="name" id="name">Baby Sol ❤️</div>

  <div class="message" id="message" aria-live="polite"></div>

  <div class="buttons" id="buttons">
    <button type="button" class="yes" id="yesBtn">Yes 💖</button>
    <button type="button" class="no" id="noBtn">No 🙈</button>
  </div>

  <div class="tease" id="tease"></div>

  <div class="final" id="final">
    You just made me the happiest person 🥹❤️
    <br>
    I love you so much, always 💕
    <div class="signature">— from James Tolentino 💖</div>
  </div>

  <a
    class="whatsapp-link"
    id="whatsappLink"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
  >Send me a message on WhatsApp 💌</a>
</main>

<audio id="music" loop preload="none">
  <source
    src="https://cdn.pixabay.com/audio/2022/02/23/audio_0c8c7cfa0b.mp3"
    type="audio/mpeg"
  >
</audio>

<script>
"use strict";

/* =========================
   SETTINGS
========================= */

const PASSWORD = "sol123";

const message = `Baby Sol ❤️

I don’t need many words…

because all I know is this—

I love you so much.

You make my world brighter,
my days happier,
and my heart complete.

If I had to choose again,
I would still choose you… every single time. 💕

Will you be mine? ❤️`;

const whatsappText =
  "Hi Baby Sol ❤️ Thank you for saying yes… " +
  "I love you so much 💕 — James";

const whatsappURL =
  "https://wa.me/?text=" + encodeURIComponent(whatsappText);

const teaseTexts = [
  "Hey 😳",
  "Don't do that 🙈",
  "Are you sure? 😏",
  "My heart chose you already ❤️",
  "Just press YES 😌"
];

/* =========================
   ELEMENTS
========================= */

const passwordOverlay = document.getElementById("passwordOverlay");
const passwordForm = document.getElementById("passwordForm");
const passwordInput = document.getElementById("pwd");
const passwordError = document.getElementById("passwordError");

const tapText = document.getElementById("tapText");
const heart = document.getElementById("heart");
const nameElement = document.getElementById("name");
const messageElement = document.getElementById("message");
const buttons = document.getElementById("buttons");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const tease = document.getElementById("tease");
const finalMessage = document.getElementById("final");
const whatsappLink = document.getElementById("whatsappLink");
const music = document.getElementById("music");

/* =========================
   STATE
========================= */

let started = false;
let accepted = false;
let index = 0;
let noCount = 0;
let typingTimer = null;
let floatingTimer = null;

/* =========================
   PASSWORD
========================= */

passwordForm.addEventListener("submit", function(event) {
  event.preventDefault();

  if (passwordInput.value === PASSWORD) {
    passwordOverlay.style.display = "none";
    passwordError.textContent = "";
    heart.focus({ preventScroll: true });
  } else {
    passwordError.textContent = "Wrong password 😢 Try again!";
    passwordInput.value = "";
    passwordInput.focus();
  }
});

/* =========================
   START LOVE LETTER
========================= */

heart.addEventListener("click", startLove);

function startLove() {
  if (started) return;
  started = true;

  tapText.style.display = "none";
  heart.style.display = "none";
  nameElement.style.display = "block";
  messageElement.style.display = "block";

  // Browsers may require user interaction before playing audio.
  music.volume = 0.55;
  music.play().catch(function() {
    // The letter still works if music cannot play.
  });

  typeText();

  // Create only one interval, even if the heart is clicked repeatedly.
  floatingTimer = setInterval(function() {
    if (!accepted) {
      createHeart();
      if (Math.random() > 0.45) createFloatingText();
    }
  }, 850);
}

/* =========================
   TYPEWRITER
========================= */

function typeText() {
  if (index < message.length) {
    messageElement.textContent += message[index];
    index++;

    const delay = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches ? 0 : 35;

    typingTimer = setTimeout(typeText, delay);
  } else {
    buttons.style.display = "block";
  }
}

/* =========================
   YES BUTTON
========================= */

yesBtn.addEventListener("click", sayYes);

function sayYes() {
  if (accepted) return;
  accepted = true;

  clearTimeout(typingTimer);
  clearInterval(floatingTimer);

  // Finish the letter if YES is pressed before typing ends.
  messageElement.textContent = message;

  buttons.style.display = "none";
  tease.style.display = "none";
  finalMessage.style.display = "block";

  whatsappLink.href = whatsappURL;
  whatsappLink.style.display = "inline-block";

  // Romantic heart burst.
  for (let i = 0; i < 30; i++) {
    setTimeout(createHeart, i * 70);
  }

  // Show a visible link as a fallback if a popup is blocked.
  // The user can open WhatsApp by tapping the link.
}

/* =========================
   NO BUTTON DODGE
========================= */

noBtn.addEventListener("pointerenter", dodgeNo);
noBtn.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  dodgeNo();
});

function dodgeNo() {
  if (accepted) return;

  noCount++;

  const containerRect = buttons.getBoundingClientRect();
  const buttonRect = noBtn.getBoundingClientRect();

  const maxX = Math.max(0, containerRect.width - buttonRect.width);
  const maxY = Math.max(0, containerRect.height - buttonRect.height);

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";

  tease.textContent =
    teaseTexts[Math.min(noCount - 1, teaseTexts.length - 1)];
}

/* =========================
   FLOATING HEARTS
========================= */

function createHeart() {
  const h = document.createElement("div");

  h.className = "floating-heart";
  h.textContent = ["❤️", "💕", "💗", "💖", "💘"][
    Math.floor(Math.random() * 5)
  ];

  h.style.left = Math.random() * 95 + "vw";
  h.style.animationDuration = (Math.random() * 2 + 4) + "s";

  document.body.appendChild(h);

  setTimeout(function() {
    h.remove();
  }, 6500);
}

/* =========================
   FLOATING TEXT
========================= */

function createFloatingText() {
  const t = document.createElement("div");

  t.className = "floating-text";
  t.textContent = "Baby Sol ❤️";
  t.style.left = Math.random() * 85 + "vw";
  t.style.animationDuration = (Math.random() * 2 + 4) + "s";

  document.body.appendChild(t);

  setTimeout(function() {
    t.remove();
  }, 6500);
}
</script>

</body>
  </html>
